<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A70"/>
      <stop offset="100%" stop-color="#D92D48"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFF0F2" stop-opacity="0.90"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#9E162B" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Shield -->
  <path d="M256 32 C340 68 436 78 448 88 C448 248 376 392 256 468 C136 392 64 248 64 88 C76 78 172 68 256 32 Z" fill="url(#shieldGrad)" filter="url(#shadow)"/>
  
  <!-- Subtle Border Highlight -->
  <path d="M256 50 C332 82 420 92 432 100 C432 240 364 374 256 444 C148 374 80 240 80 100 C92 92 180 82 256 50 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="6"/>

  <!-- Inner Protective Emblem / Heart-Lotus Safety Symbol -->
  <g transform="translate(128, 140) scale(0.5)">
    <!-- Heart shape -->
    <path d="M256 448 C160 360 48 270 48 160 C48 80 110 24 190 24 C234 24 274 52 256 96 C238 52 278 24 322 24 C402 24 464 80 464 160 C464 270 352 360 256 448 Z" fill="#FFFFFF" opacity="0.98"/>
    <!-- Small Inner Security Spark -->
    <path d="M256 160 L272 208 L320 224 L272 240 L256 288 L240 240 L192 224 L240 208 Z" fill="#D92D48"/>
  </g>
</svg>
